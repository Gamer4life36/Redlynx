<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: redlynx:;">
<title>Parked</title>
<style>
  /* Shown in place of a tab that has not been loaded yet. Deliberately quiet:
     it is not an error, and it should not look like one. */
  :root{
    --bg:#0f1115; --panel:#1a1f28; --bd:#2a3342;
    --txt:#e6e9ef; --mut:#8b93a3; --accent:#e63946;
  }
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--txt);
    font:14px/1.5 system-ui,Segoe UI,sans-serif;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; padding:24px;
  }
  .card{
    max-width:520px; text-align:center;
    border:1px solid var(--bd); border-radius:14px;
    background:var(--panel); padding:30px 34px;
  }
  .icon{
    width:44px; height:44px; border-radius:10px; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg); border:1px solid var(--bd);
    font-size:20px; font-weight:700; color:var(--mut); overflow:hidden;
  }
  .icon img{width:28px;height:28px;display:block}
  h1{font-size:17px; font-weight:600; margin:0 0 6px; overflow-wrap:anywhere}
  .url{font-size:12px; color:var(--mut); margin-bottom:20px; overflow-wrap:anywhere}
  button{
    font:inherit; font-weight:600; color:#fff; background:var(--accent);
    border:0; border-radius:9px; padding:10px 22px; cursor:pointer;
  }
  button:hover{filter:brightness(1.1)}
  .hint{margin-top:14px; font-size:12px; color:var(--mut)}
</style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">◌</div>
    <h1 id="title">Parked tab</h1>
    <div class="url" id="url"></div>
    <button id="load">Load this page</button>
    <div class="hint">This tab has not been opened yet, so nothing on it is running &mdash;
      no scripts, no audio, no video. Click anywhere to load it.</div>
  </div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var url = q.get('u') || '';
    var title = q.get('t') || '';
    var fav = q.get('f') || '';

    if (title) document.getElementById('title').textContent = title;
    document.getElementById('url').textContent = url;
    document.title = title ? (title + ' — parked') : 'Parked';

    if (fav && fav.indexOf('data:image/') === 0) {
      var img = document.createElement('img');
      img.src = fav;
      img.alt = '';
      img.onerror = function () { img.remove(); };
      var host = document.getElementById('icon');
      host.textContent = '';
      host.appendChild(img);
    } else if (url) {
      try {
        var h = new URL(url).hostname.replace(/^www\./, '');
        document.getElementById('icon').textContent = (h[0] || '?').toUpperCase();
      } catch (e) {}
    }

    function load() {
      if (window.__redlynxParked && window.__redlynxParked.load) window.__redlynxParked.load();
      else if (url) location.href = url;
    }
    document.getElementById('load').onclick = function (e) { e.stopPropagation(); load(); };
    document.body.onclick = load;
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); load(); }
    });
  })();
</script>
</body>
</html>
