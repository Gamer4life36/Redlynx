<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src redlynx: data:;">
  <title>New tab</title>
  <style>
    :root{ --txt:#f2f4f8; --mut:#aab3c0; --accent:#e63946; }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      background:#0f1115; color:var(--txt);
      font:14px/1.4 'Segoe UI',system-ui,sans-serif;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      overflow:hidden; user-select:none;
    }
    /* the user's image or GIF, dimmed/blurred to taste */
    #bg{
      position:fixed; inset:0; z-index:0;
      background-position:center; background-size:cover; background-repeat:no-repeat;
      transition:opacity .3s;
    }
    #scrim{position:fixed;inset:0;z-index:1;background:rgba(10,12,16,.35)}
    .wrap{position:relative;z-index:2;width:min(720px,88vw);text-align:center;margin-top:-6vh}
    .clock{font-size:64px;font-weight:200;letter-spacing:-1px;text-shadow:0 2px 24px rgba(0,0,0,.55)}
    .date{color:var(--mut);margin:-4px 0 26px;text-shadow:0 1px 10px rgba(0,0,0,.6)}
    .search{
      display:flex;align-items:center;gap:10px;width:100%;
      background:rgba(20,24,32,.72); border:1px solid rgba(255,255,255,.14);
      border-radius:26px; padding:0 18px; height:50px;
      backdrop-filter:blur(14px); box-shadow:0 10px 40px rgba(0,0,0,.4);
    }
    .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(230,57,70,.22),0 10px 40px rgba(0,0,0,.4)}
    .search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:15px;user-select:text}
    .search .ic{opacity:.7;font-size:15px}
    .tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:32px}
    .tile{
      position:relative; text-decoration:none;
      display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;
      background:rgba(20,24,32,.6); border:1px solid rgba(255,255,255,.10);
      border-radius:12px; cursor:pointer; backdrop-filter:blur(10px);
      transition:transform .12s, border-color .12s, background .12s;
    }
    .tile:hover{transform:translateY(-2px);border-color:var(--accent);background:rgba(30,34,44,.76)}
    /* The remove button only appears on hover, so the tiles stay clean, but it
       is always in the DOM and always keyboard reachable. */
    .tile .del{
      position:absolute;top:4px;right:4px;width:18px;height:18px;line-height:16px;
      border:0;border-radius:50%;cursor:pointer;font-size:11px;padding:0;
      background:rgba(0,0,0,.45);color:var(--mut);opacity:0;transition:opacity .12s,background .12s,color .12s;
    }
    .tile:hover .del,.tile .del:focus{opacity:1}
    .tile .del:hover{background:var(--accent);color:#fff}
    /* Sits under the search box: an offer, never a replacement. Enter still
       runs exactly what was typed. */
    .didyou{margin-top:10px;font-size:12.5px;color:var(--mut);min-height:18px;opacity:0;transition:opacity .12s}
    .didyou.show{opacity:1}
    .didyou button{
      background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;
      font-weight:600;text-decoration:underline;padding:0 3px;
    }
    .undo{
      margin-top:14px;font-size:12px;color:var(--mut);opacity:0;transition:opacity .15s;
    }
    .undo.show{opacity:1}
    .undo button{
      background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline;padding:0 4px;
    }
    .tile .fav{
      width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
      background:var(--accent);color:#fff;font-weight:700;font-size:14px;
    }
    .tile .nm{font-size:11px;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hint{position:fixed;bottom:16px;z-index:2;color:var(--mut);font-size:11.5px;opacity:.75;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="scrim"></div>

  <div class="wrap">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
    <form class="search" id="form">
      <span class="ic">🔎</span>
      <input id="q" placeholder="Search the web, or type an address" autocomplete="off" spellcheck="false" autofocus>
    </form>
    <div class="didyou" id="didyou" aria-live="polite"></div>
    <div class="tiles" id="tiles"></div>
    <div class="undo" id="undo" aria-live="polite"></div>
  </div>
  <div class="hint">Set a background image or GIF in Settings → Appearance</div>

  <script>
    // Clock
    function tick() {
      const d = new Date();
      document.getElementById('clock').textContent =
        d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('date').textContent =
        d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    }
    tick(); setInterval(tick, 10000);

    // The page is sandboxed with no preload, so it talks to the browser the
    // only way it can: by navigating. The omnibar logic handles the rest.
    document.getElementById('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = document.getElementById('q').value.trim();
      if (!v) return;
      const isUrl = /^[a-z]+:\/\//i.test(v) || (/^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(v) && !/\s/.test(v));
      location.href = isUrl
        ? (/^[a-z]+:\/\//i.test(v) ? v : 'https://' + v)
        : 'REDLYNX_SEARCH' + encodeURIComponent(v);
    });

    // Background + top sites are injected by the browser after load.
    window.__redlynxInit = function (cfg) {
      const bg = document.getElementById('bg');
      if (cfg.bg) {
        bg.style.backgroundImage = 'url("' + cfg.bg + '")';
        bg.style.opacity = (cfg.opacity != null ? cfg.opacity : 45) / 100;
        bg.style.filter = cfg.blur ? ('blur(' + cfg.blur + 'px)') : 'none';
        document.getElementById('scrim').style.background =
          'rgba(10,12,16,' + Math.max(0, 0.55 - (cfg.opacity || 45) / 200) + ')';
      }
      renderTiles(cfg.sites || []);
    };

    var undoTimer = null;
    var fixTimer = null;
    var lastFix = null;

    // Corrections are looked up as you type, but not on every keystroke.
    function watchTypos() {
      var box = document.getElementById('q');
      var line = document.getElementById('didyou');
      box.addEventListener('input', function () {
        clearTimeout(fixTimer);
        var v = box.value;
        if (!v.trim()) { line.classList.remove('show'); line.innerHTML = ''; lastFix = null; return; }
        fixTimer = setTimeout(async function () {
          if (!window.__redlynxNewTab || !window.__redlynxNewTab.correct) return;
          var fix = await window.__redlynxNewTab.correct(v);
          // The box may have moved on while we were asking.
          if (box.value !== v) return;
          lastFix = fix;
          line.innerHTML = '';
          if (!fix) { line.classList.remove('show'); return; }
          line.appendChild(document.createTextNode(fix.isDomain ? 'Did you mean ' : 'Did you mean '));
          var b = document.createElement('button');
          b.textContent = fix.text;
          b.onclick = function () { location.href = fix.url; };
          line.appendChild(b);
          line.appendChild(document.createTextNode('?'));
          line.classList.add('show');
        }, 260);
      });
      // Tab accepts the offer, the way a completion normally works.
      box.addEventListener('keydown', function (e) {
        if (e.key === 'Tab' && lastFix) {
          e.preventDefault();
          box.value = lastFix.text;
          line.classList.remove('show');
          lastFix = null;
        }
      });
    }
    watchTypos();

    function renderTiles(sites) {
      const tiles = document.getElementById('tiles');
      tiles.innerHTML = '';
      sites.forEach((s) => {
        // A real link, not a div: right-clicking it then gets the browser's
        // own menu, including Pin to sidebar, for free.
        const el = document.createElement('a');
        el.href = s.url;
        el.className = 'tile';
        el.title = s.url;
        el.innerHTML = '<button class="del" title="Remove" aria-label="Remove ' + s.host + '">✕</button>'
                     + '<div class="fav"></div><div class="nm"></div>';
        el.querySelector('.fav').textContent = (s.host || '?')[0].toUpperCase();
        el.querySelector('.nm').textContent = s.host;
        el.onclick = (e) => { e.preventDefault(); location.href = s.url; };
        el.querySelector('.del').onclick = (e) => {
          // Without this the click falls through to the tile and navigates —
          // removing a shortcut would open it instead.
          e.stopPropagation();
          e.preventDefault();
          removeSite(s.host);
        };
        tiles.appendChild(el);
      });
      tiles.style.display = sites.length ? '' : 'none';
    }

    function removeSite(host) {
      if (!window.__redlynxNewTab) return;
      window.__redlynxNewTab.hide(host).then((sites) => {
        renderTiles(sites || []);
        showUndo(host);
      });
    }

    // A shortcut removed by accident should be one click from coming back.
    function showUndo(host) {
      const bar = document.getElementById('undo');
      bar.innerHTML = '';
      bar.appendChild(document.createTextNode('Removed ' + host + '.'));
      const btn = document.createElement('button');
      btn.textContent = 'Undo';
      btn.onclick = () => {
        window.__redlynxNewTab.restore(host).then((sites) => {
          renderTiles(sites || []);
          hideUndo();
        });
      };
      bar.appendChild(btn);
      bar.classList.add('show');
      clearTimeout(undoTimer);
      undoTimer = setTimeout(hideUndo, 8000);
    }

    function hideUndo() {
      const bar = document.getElementById('undo');
      bar.classList.remove('show');
      clearTimeout(undoTimer);
      setTimeout(() => { if (!bar.classList.contains('show')) bar.innerHTML = ''; }, 200);
    }
  </script>
</body>
</html>
